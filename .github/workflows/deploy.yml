name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install WireGuard
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard
      
      - name: Write WireGuard config
        run: |
          mkdir -p ~/.wireguard
          cat > ~/.wireguard/wg0.conf <<'EOF'
          ${{ secrets.WG_RUNNER_CONFIG }}
          EOF
          chmod 600 ~/.wireguard/wg0.conf
          sed -n '1,20p' ~/.wireguard/wg0.conf | sed 's/PrivateKey.*/PrivateKey = ***hidden***/'
      
      - name: Start WireGuard
        run: |
          sudo wg-quick up ~/.wireguard/wg0.conf || {
            sudo journalctl -xe --no-pager | tail -n 100 || true
            sudo wg show || true
            exit 1
          }
          
      - name: Add SSH known_hosts
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      - name: Run deploy script
        shell: bash
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            sudo /usr/local/bin/dispo-deploy.sh
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      - name: Stop WireGuard
        if: always()
        shell: bash
        run: sudo wg-quick down wg0 || true
